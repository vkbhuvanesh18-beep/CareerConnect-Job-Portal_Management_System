# Activate with: --spring.profiles.active=mysql
# Database values are read from environment variables so no password is stored in Git.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/careerconnect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
