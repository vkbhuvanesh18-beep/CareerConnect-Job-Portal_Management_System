<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account | CareerConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm border-0"><div class="card-body p-4">
    <h1 class="h3">Create Job Seeker Account</h1><p class="text-muted">Fields marked required must be completed.</p>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form method="post" action="/register">
      <div class="mb-3"><label class="form-label" for="fullName">Full Name</label><input id="fullName" name="fullName" class="form-control" required></div>
      <div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" name="username" class="form-control" pattern="[A-Za-z0-9_]{3,20}" title="Use 3–20 letters, numbers, or underscores." required><div class="form-text">Use 3–20 letters, numbers, or underscores.</div></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><div class="input-group"><input id="password" name="password" type="password" minlength="6" class="form-control" required><button id="togglePassword" class="btn btn-outline-secondary" type="button">👁 <span>Show</span></button></div><div class="form-text">Use at least 6 characters.</div></div>
      <div class="mb-3"><label class="form-label" for="confirmPassword">Confirm Password</label><div class="input-group"><input id="confirmPassword" name="confirmPassword" type="password" minlength="6" class="form-control" required><button id="toggleConfirm" class="btn btn-outline-secondary" type="button">👁 <span>Show</span></button></div><div id="passwordMessage" class="text-danger small mt-1" hidden>Passwords do not match.</div></div>
      <button class="btn btn-primary w-100">Create Account</button>
    </form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="/login">Login</a></p>
  </div></div>
</div></div></main>
<script>
function toggle(inputId,buttonId){const input=document.getElementById(inputId),button=document.getElementById(buttonId);button.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';button.querySelector('span').textContent=show?'Hide':'Show';});}
toggle('password','togglePassword');toggle('confirmPassword','toggleConfirm');
const password=document.getElementById('password'),confirmPassword=document.getElementById('confirmPassword'),message=document.getElementById('passwordMessage');
confirmPassword.addEventListener('input',()=>{message.hidden=!confirmPassword.value||password.value===confirmPassword.value;});
</script>
</body></html>
