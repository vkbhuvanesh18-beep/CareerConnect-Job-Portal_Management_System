<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate Pipeline | CareerConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/admin.css" rel="stylesheet"></head><body><nav class="admin-nav navbar navbar-dark"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="/"><span class="brand-icon"><i class="bi bi-briefcase-fill"></i></span>CareerConnect <span class="admin-pill">ADMIN</span></a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" href="/admin/jobs">Jobs</a><form method="post" action="/logout"><button class="btn btn-light btn-sm">Logout</button></form></div></div></nav><main class="container py-4 py-md-5"><section class="page-heading"><p class="eyebrow">RECRUITMENT PIPELINE</p><h1>Candidate Applications</h1><p>Filter by match score, update the candidate stage, and schedule interviews.</p></section><form method="get" class="dashboard-card p-3 mb-4"><div class="row align-items-end g-2"><div class="col-md-4"><label class="form-label fw-semibold">Minimum match percentage</label><input type="number" min="0" max="100" class="form-control" name="minMatch" th:value="${minMatch}"></div><div class="col-md-2"><button class="btn btn-primary w-100">Filter Candidates</button></div></div></form><div class="dashboard-card"><div class="table-responsive"><table class="table admin-table align-middle mb-0"><thead><tr><th>Candidate</th><th>Job</th><th>Match</th><th>Stage</th><th>Schedule / update</th></tr></thead><tbody><tr th:each="application : ${applications}"><td><div class="applicant"><span class="avatar" th:text="${#strings.substring(application.applicant.fullName,0,1)}">A</span><div><strong th:text="${application.applicant.fullName}"></strong><small class="d-block text-muted" th:text="${application.applicant.email}"></small></div></div></td><td th:text="${application.job.title}"></td><td><span class="badge text-bg-success fs-6" th:text="${application.matchScore + '%'}"></span></td><td><span class="status-badge" th:text="${application.status}"></span><small class="d-block mt-1" th:if="${application.interviewScheduledAt != null}" th:text="${application.interviewScheduledAt}"></small></td><td><form method="post" th:action="@{/admin/applications/{id}/status(id=${application.id})}" class="row g-2"><div class="col-md-5"><select name="status" class="form-select form-select-sm"><option th:each="stage : ${T(com.careerconnect.jobportal.model.ApplicationStatus).values()}" th:value="${stage}" th:text="${stage}" th:selected="${stage == application.status}"></option></select></div><div class="col-md-5"><input type="datetime-local" name="interviewScheduledAt" class="form-control form-control-sm" title="Set only when stage is INTERVIEW"></div><div class="col-md-2"><button class="btn btn-sm btn-primary w-100">Save</button></div></form></td></tr><tr th:if="${#lists.isEmpty(applications)}"><td colspan="5" class="empty-state"><i class="bi bi-people"></i><h3>No candidates meet this score</h3><p>Try a lower minimum percentage or wait for new applications.</p></td></tr></tbody></table></div></div></main></body></html>
