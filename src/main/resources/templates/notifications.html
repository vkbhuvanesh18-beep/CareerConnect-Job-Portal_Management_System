<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CareerConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container py-5"><h1>Recruitment Notifications</h1><p class="text-muted">Updates are sent here whenever a recruiter changes your application stage.</p><div class="card shadow-sm border-0"><ul class="list-group list-group-flush"><li class="list-group-item py-3" th:each="notification : ${notifications}"><strong th:text="${notification.message}"></strong><br><small class="text-muted" th:text="${notification.createdOn}"></small></li><li class="list-group-item text-center" th:if="${#lists.isEmpty(notifications)}">No notifications yet.</li></ul></div><a class="btn btn-outline-primary mt-3" href="/applications">Back to Applications</a></main></body></html>
