<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | CareerConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-md-8"><div class="card shadow-sm border-0"><div class="card-body p-4"><h1 class="h3">Apply for <span th:text="${job.title}"></span></h1><p class="text-muted" th:text="${job.companyName + ' · ' + job.location}"></p><div class="alert alert-info"><strong>Your profile match: <span th:text="${matchScore + '%'}"></span></strong><br><small>This score compares your skill tags and experience with the job requirements.</small></div><form method="post"><div class="mb-3"><label class="form-label">Cover Letter (optional)</label><textarea name="coverLetter" class="form-control" rows="6" placeholder="Tell the employer why you are a good fit."></textarea></div><button class="btn btn-success">Submit Application</button><a class="btn btn-outline-secondary" th:href="@{/jobs/{id}(id=${job.id})}">Cancel</a></form></div></div></div></div></main></body></html>
