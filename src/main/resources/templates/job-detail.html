<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container py-5"><a href="/jobs">← Back to Jobs</a><div class="card shadow-sm border-0 mt-3"><div class="card-body p-4"><span class="badge text-bg-primary" th:text="${job.category}"></span><h1 class="mt-3" th:text="${job.title}"></h1><p class="lead" th:text="${job.companyName}"></p><p class="text-muted" th:text="${job.location + ' · Salary: ₹' + job.salary + ' · Deadline: ' + job.deadline}"></p><hr><h2 class="h4">Job Description</h2><p th:text="${job.description}"></p><div class="alert alert-light border" th:if="${!#strings.isEmpty(job.requiredSkills)}"><strong>Required skill tags:</strong> <span th:text="${job.requiredSkills}"></span><br><strong>Minimum experience:</strong> <span th:text="${job.minimumExperienceYears + ' years'}"></span></div><a class="btn btn-success" th:href="@{/jobs/{id}/apply(id=${job.id})}">Check Match & Apply</a></div></div></main></body></html>
