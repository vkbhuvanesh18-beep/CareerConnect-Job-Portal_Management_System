<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Applications | CareerConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container py-5"><div class="d-flex justify-content-between align-items-center"><h1>My Applications</h1><a class="btn btn-outline-primary" href="/notifications">Notifications</a></div><div class="alert alert-success mt-3" th:if="${param.applied}">Your application was submitted successfully. The match score is now visible below.</div><div class="card shadow-sm border-0 mt-3"><div class="table-responsive"><table class="table mb-0"><thead class="table-light"><tr><th>Job</th><th>Company</th><th>Match score</th><th>Pipeline stage</th><th>Interview</th></tr></thead><tbody><tr th:each="application : ${applications}"><td th:text="${application.job.title}"></td><td th:text="${application.job.companyName}"></td><td><span class="badge text-bg-success" th:text="${application.matchScore + '%'}"></span></td><td><span class="badge text-bg-primary" th:text="${application.status}"></span></td><td th:text="${application.interviewScheduledAt == null ? 'Not scheduled' : application.interviewScheduledAt}"></td></tr><tr th:if="${#lists.isEmpty(applications)}"><td colspan="5" class="text-center">You have not applied for any jobs yet.</td></tr></tbody></table></div></div><a class="btn btn-outline-primary mt-3" href="/jobs">Find Jobs</a></main></body></html>
