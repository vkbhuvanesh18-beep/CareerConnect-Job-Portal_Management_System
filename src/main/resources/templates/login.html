<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | CareerConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm border-0"><div class="card-body p-4">
    <div class="text-center mb-4"><a href="/" class="text-decoration-none"><div class="h2 fw-bold text-primary mb-1">CareerConnect</div></a><div class="text-muted small">Your path to the right opportunity</div></div>
    <h1 class="h3">Login</h1><p class="text-muted">Enter your account details to continue.</p>
    <div class="alert alert-success" th:if="${param.registered}">Account created successfully. Please log in.</div>
    <div class="alert alert-success" th:if="${param.logout}">You have logged out successfully.</div>
    <div class="alert alert-danger" th:if="${param.error}">Invalid username or password. Please try again.</div>
    <form method="post" action="/login">
      <div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" name="username" class="form-control" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><div class="input-group"><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required><button id="togglePassword" class="btn btn-outline-secondary" type="button" aria-label="Show password">👁 <span>Show</span></button></div></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">New user? <a href="/register">Create an account</a></p><a class="d-block text-center mt-3" href="/">Back to home</a>
  </div></div>
</div></div></main>
<script>
const password=document.getElementById('password'),button=document.getElementById('togglePassword');
button.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';button.querySelector('span').textContent=show?'Hide':'Show';button.setAttribute('aria-label',show?'Hide password':'Show password');});
</script>
</body></html>
