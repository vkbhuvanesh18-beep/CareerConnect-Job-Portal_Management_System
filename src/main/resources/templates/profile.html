<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | CareerConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5"><h1 class="h3">My Job Seeker Profile</h1><p class="text-muted">Add skill tags and experience to receive a better job match score.</p><div class="alert alert-success" th:if="${param.saved}">Profile saved successfully.</div><div class="alert alert-warning" th:if="${param.incomplete}">Complete your phone, qualification, and skills before applying.</div><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" th:value="${profile.phone}" required></div><div class="col-md-6"><label class="form-label">Qualification / Education</label><input name="qualification" class="form-control" placeholder="B.E. Computer Science" th:value="${profile.qualification}" required></div><div class="col-12"><label class="form-label">Verified skill tags</label><input name="skills" class="form-control" placeholder="Java, Spring Boot, MySQL" th:value="${profile.skills}" required><div class="form-text">Separate each skill with a comma.</div></div><div class="col-md-6"><label class="form-label">Experience years</label><input type="number" min="0" name="experienceYears" class="form-control" th:value="${profile.experienceYears}"></div><div class="col-md-6"><label class="form-label">Portfolio link</label><input type="url" name="portfolioUrl" class="form-control" placeholder="https://github.com/your-name" th:value="${profile.portfolioUrl}"></div><div class="col-12"><label class="form-label">Experience details</label><textarea name="experience" class="form-control" rows="4" th:text="${profile.experience}"></textarea></div></div><button class="btn btn-primary mt-4">Save Profile</button><a class="btn btn-outline-secondary mt-4" href="/jobs">Find Jobs</a></form></div></div></div></div></main></body></html>
