<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobs | CareerConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">CareerConnect</a><a class="btn btn-light btn-sm" href="/login">Login</a></div></nav><main class="container py-4"><h1>Available Jobs</h1><form class="card shadow-sm border-0 p-3 mb-4" method="get"><div class="row g-2"><div class="col-md-5"><input class="form-control" name="q" th:value="${q}" placeholder="Job title, company, or category"></div><div class="col-md-5"><input class="form-control" name="location" th:value="${location}" placeholder="Location"></div><div class="col-md-2"><button class="btn btn-primary w-100">Search</button></div></div></form><div class="row g-4"><div class="col-md-6" th:each="job : ${jobs}"><div class="card job-card shadow-sm h-100"><div class="card-body"><span class="badge text-bg-primary" th:text="${job.category}"></span><h2 class="h4 mt-3" th:text="${job.title}"></h2><p class="fw-semibold" th:text="${job.companyName}"></p><p class="text-muted" th:text="${job.location + ' · ₹' + job.salary}"></p><p><small>Deadline: <span th:text="${job.deadline}"></span></small></p><a class="btn btn-primary" th:href="@{/jobs/{id}(id=${job.id})}">View & Apply</a></div></div></div><div class="col-12" th:if="${#lists.isEmpty(jobs)}"><div class="alert alert-warning">No jobs match your search.</div></div></div></main></body></html>
